name: Dependabot Janitor

# Daily sweep that auto-merges green Dependabot patch/minor PRs across all
# mcp-* and node-* repos in ORGS (wyre-technology and WYRE-AI as of 2026-08-25
# — the fleet split across both orgs; see dependabot-janitor.sh's own header
# for the full story). Majors, red CI, conflicts, and PRs blocked by required
# code-owner review are reported, never merged.
#
# Auth: TWO GitHub App installation tokens, one per org (2026-11-05,
# task_1793893256342_67059595 — see dependabot-janitor.sh's header for the
# full incident: a single wyre-technology-only token silently failed every
# WRITE on WYRE-AI for a month while reads kept working on WYRE-AI's public
# repos, and the resulting review-approval failures got misclassified as
# code-owner blocks). wyre-projects-bot (APP_ID/APP_PRIVATE_KEY secrets) is
# installed on wyre-technology only. wyre-agent-fleet (AGENT_FLEET_APP_ID/
# AGENT_FLEET_APP_PRIVATE_KEY secrets — same secret names and values as the
# WYRE-AI/.github copy of github-activity-notifier.yml, which already mints
# from this App) is installed on WYRE-AI only, confirmed live via `gh api
# orgs/WYRE-AI/installations` 2026-11-05: repository_selection=all,
# permissions include contents:write + pull_requests:write + packages:write.
# PRE-MERGE CHECK (infra/Aaron, not verifiable by the author of this PR —
# minting WYRE-AI-scoped tokens locally was blocked by the standing
# OP_SERVICE_ACCOUNT_TOKEN outage, task_1793062101039_15116170, at write
# time): confirm AGENT_FLEET_APP_ID / AGENT_FLEET_APP_PRIVATE_KEY already
# exist as secrets visible to wyre-technology/.github's workflows (org-level
# secret inherited, or add them at repo level here) — a GitHub App's private
# key is global to the App regardless of which org's Actions runner uses it
# to mint, so the same WYRE-AI/.github secret values work here unchanged if
# copied over. If they're not yet set, this workflow's new "Mint WYRE-AI
# installation token" step will fail loudly (unlike the bug this PR fixes),
# which is the correct fail-closed behavior until they are.

on:
  schedule:
    - cron: "0 13 * * *" # 09:00 America/New_York (13:00 UTC)
    - cron: "0 21 * * *" # 17:00 America/New_York (21:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify and report only; do not merge"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dependabot-janitor
  cancel-in-progress: false

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - name: Mint wyre-technology installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # wyre-projects-bot (app_id 3588278) is installed on wyre-technology
          # only — see dependabot-janitor.sh's header for the full dual-org
          # story and the 2026-11-05 incident this two-token split fixes.
          owner: wyre-technology

      - name: Mint WYRE-AI installation token
        id: app-token-wyre-ai
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AGENT_FLEET_APP_ID }}
          private-key: ${{ secrets.AGENT_FLEET_APP_PRIVATE_KEY }}
          # wyre-agent-fleet (installation 158846229) is installed on WYRE-AI
          # only — confirmed live 2026-11-05 via `gh api
          # orgs/WYRE-AI/installations` (repository_selection=all,
          # pull_requests:write present). Same App/secrets the WYRE-AI/.github
          # copy of github-activity-notifier.yml already mints from.
          owner: WYRE-AI

      - name: Check out scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Persist the wyre-technology app token so the backlog commit can
          # push back to THIS repo (wyre-technology/.github) — the WYRE-AI
          # token has no installation grant here and isn't relevant to this step.
          token: ${{ steps.app-token.outputs.token }}

      - name: Run janitor
        env:
          GH_TOKEN_WYRE_TECHNOLOGY: ${{ steps.app-token.outputs.token }}
          GH_TOKEN_WYRE_AI: ${{ steps.app-token-wyre-ai.outputs.token }}
          # Was ORG: ${{ github.repository_owner }} — that pinned this to
          # wyre-technology only and silently overrode dependabot-janitor.sh's
          # own ORGS default (see that file's header). Removed so the script's
          # "wyre-technology WYRE-AI" default takes effect. Both tokens above
          # are now org-scoped correctly (see dependabot-janitor.sh's
          # token_for_org()) — unlike the pre-2026-11-05 single-token setup,
          # WYRE-AI repos get a token with real write access, not just one
          # that happens to pass read-only public-repo calls.
          DRY_RUN: ${{ inputs.dry_run }}
          BACKLOG_FILE: dependabot-backlog.md
          # 2026-08-21: all 25 repos originally held out (see task_1786765529531
          # for why this janitor was disabled 07-21, and .github#57 for the
          # exclusion mechanism itself) have now had their mcp-server-release.yml/
          # mcp-server-deploy.yml pins migrated past the pre-fix SHA with real
          # red/green CI confirmed on each migration PR. EXCLUDE_REPOS empty as
          # of PR .github#64 -- mechanism left in place for any future repo that
          # needs the same vacuous-CI protection.
        run: bash .github/scripts/dependabot-janitor.sh

      - name: Commit backlog if changed
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "wyre-projects-bot[bot]"
          git config user.email "wyre-projects-bot[bot]@users.noreply.github.com"
          if ! git diff --quiet -- dependabot-backlog.md; then
            git add dependabot-backlog.md
            git commit -m "chore: update Dependabot backlog [skip ci]"
            git push
          else
            echo "Backlog unchanged — nothing to commit."
          fi
