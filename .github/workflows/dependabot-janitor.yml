name: Dependabot Janitor

# Daily sweep that auto-merges green Dependabot patch/minor PRs across all
# wyre-technology mcp-* and node-* repos. Majors, red CI, conflicts, and PRs
# blocked by required code-owner review are reported, never merged.
#
# Auth: a GitHub App installation token (APP_ID / APP_PRIVATE_KEY org secrets).
# The app must have Contents: Read & write and Pull requests: Read & write.

on:
  schedule:
    - cron: "0 13 * * *" # 09:00 America/New_York (13:00 UTC)
    - cron: "0 21 * * *" # 17:00 America/New_York (21:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify and report only; do not merge"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dependabot-janitor
  cancel-in-progress: false

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - name: Mint org-wide installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Persist the app token so the backlog commit can push back to .github.
          token: ${{ steps.app-token.outputs.token }}

      - name: Run janitor
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run }}
          BACKLOG_FILE: dependabot-backlog.md
          # 2026-08-21: held out until each repo's mcp-server-release.yml pin
          # is bumped past the pre-fix SHA and its CI is confirmed to
          # actually build (see task_1786765529531 for why this janitor was
          # disabled 07-21, and .github#57 for the exclusion mechanism
          # itself). Remove a repo from this list only after confirming its
          # pin is current AND a real PR has shown genuine red/green CI, not
          # just that the pin moved. Pin-migration work tracked with forge.
          EXCLUDE_REPOS: >-
            hudu-mcp immybot-mcp inforcer-mcp ironscales-mcp itglue-mcp
            knowbe4-mcp mailprotector-mcp mimecast-mcp proofpoint-mcp
            qbo-mcp saas-alerts-mcp scalepad-mcp sherweb-mcp spamtitan-mcp
            timezest-mcp
        run: bash .github/scripts/dependabot-janitor.sh

      - name: Commit backlog if changed
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "wyre-projects-bot[bot]"
          git config user.email "wyre-projects-bot[bot]@users.noreply.github.com"
          if ! git diff --quiet -- dependabot-backlog.md; then
            git add dependabot-backlog.md
            git commit -m "chore: update Dependabot backlog [skip ci]"
            git push
          else
            echo "Backlog unchanged — nothing to commit."
          fi
