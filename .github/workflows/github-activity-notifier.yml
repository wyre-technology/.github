name: github-activity-notifier

# Posts newly opened issues/PRs across the wyre-technology org to the
# #github-activity Slack channel. Excludes "[bot]" accounts (Dependabot,
# Renovate, github-actions, ...) and the authors in EXCLUDE_AUTHORS
# (asachs01 is always excluded).
#
# Detection uses a rolling LOOKBACK window over the GitHub Search API. The
# committed state file .github/github-activity-state.json provides
# de-duplication + at-least-once delivery, so this workflow only commits when
# there is genuinely new activity. The built-in GITHUB_TOKEN can read public
# search results org-wide; no PAT is required (public repos only).
#
# The state-file commit pushes to a required-review-protected main, so it
# authenticates as the wyre-projects-bot GitHub App instead of the default
# GITHUB_TOKEN — that's the same App already used by this repo's other
# commit-back workflows (dependabot-janitor.yml, auto-add-to-project.yml,
# release-sweeper.yml), reusing the existing org-level APP_ID/APP_PRIVATE_KEY
# secrets rather than introducing a second bot identity. It's added to this
# branch's bypass_pull_request_allowances so its pushes don't need a
# human-approved PR. (The WYRE-AI copy of this workflow uses a different App,
# wyre-agent-fleet, because wyre-projects-bot is not installed on WYRE-AI.)
# Fixes the same deterministic GH006 "Protected branch update failed" failure
# found in the WYRE-AI copy (2026-09-23, task_1790165032516_80850732) --
# applied here too since it is the identical duplicated script/workflow and
# would hit the same failure the next time it has a real state update.

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log intended messages without posting to Slack'
        type: boolean
        default: false

concurrency:
  group: github-activity-notifier
  cancel-in-progress: false

permissions:
  contents: write # commit the state file back to the repo

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Mint wyre-projects-bot installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Persist the App token so the state-file commit can push to
          # protected main without a human-approved PR.
          token: ${{ steps.app-token.outputs.token }}

      - name: Notify Slack of new external activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_GITHUB_ACTIVITY_WEBHOOK_URL: ${{ secrets.SLACK_GITHUB_ACTIVITY_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          LOOKBACK_MINUTES: '60'
        run: node scripts/github-activity-notifier.mjs

      - name: Commit updated state
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "$DRY_RUN" = "1" ]; then
            echo "Dry run — not committing state."
            exit 0
          fi
          if git diff --quiet -- .github/github-activity-state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "wyre-projects-bot[bot]"
          git config user.email "281421522+wyre-projects-bot[bot]@users.noreply.github.com"
          git add .github/github-activity-state.json
          git commit -m "chore(notifier): update github-activity state [skip ci]"
          git push
