name: Auto-add to project

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_call:
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check App credentials
        id: check
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APP_ID or APP_PRIVATE_KEY not configured - skipping auto-add-to-project."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint installation token
        id: app-token
        if: steps.check.outputs.has_creds == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: wyre-technology

      - name: Add issue/PR to project
        if: steps.check.outputs.has_creds == 'true'
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/wyre-technology/projects/1
          github-token: ${{ steps.app-token.outputs.token }}
