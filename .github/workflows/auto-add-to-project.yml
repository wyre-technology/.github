name: Auto-add to project

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_call:
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check App credentials
        id: check
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APP_ID or APP_PRIVATE_KEY not configured - skipping auto-add-to-project."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint installation token
        id: app-token
        if: steps.check.outputs.has_creds == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: wyre-technology

      - name: Add issue/PR to project
        if: steps.check.outputs.has_creds == 'true'
        uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133e # v1.0.2
        with:
          project-url: https://github.com/orgs/wyre-technology/projects/1
          github-token: ${{ steps.app-token.outputs.token }}
