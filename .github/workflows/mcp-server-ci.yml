name: MCP Server CI (reusable)

# Canonical CI workflow for wyre-technology/*-mcp repositories.
# Called from each per-repo `.github/workflows/ci.yml` via `uses:`.
#
# What this workflow does:
#   - npm ci with GitHub Packages auth for @wyre-technology/* deps
#   - Lint, build, unit test on a configurable Node matrix
#   - Integration test step gated on secret presence (skips on dependabot/fork PRs)
#   - Optional Docker build smoke test
#
# Failure patterns this prevents (see related skills in ~/.claude/skills):
#   - npm 401 fetching @wyre-technology/* (ghcr-npm-auth-in-ci)
#   - NetworkError on every dependabot PR (ci-gate-integration-tests-on-secrets)
#
# Repo callers should pass `integration-secret-name` to enable secret gating.

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'JSON array of Node.js versions to matrix-test (default LTS-only).'
        type: string
        default: '["22", "24"]'
      lint:
        description: 'Run `npm run lint` if a lint script is defined.'
        type: boolean
        default: true
      typecheck:
        description: 'Run `npm run typecheck` if a typecheck script is defined.'
        type: boolean
        default: true
      build:
        description: 'Run `npm run build` if a build script is defined.'
        type: boolean
        default: true
      unit-test-script:
        description: 'npm script to run for unit tests.'
        type: string
        default: 'test'
      integration-test-script:
        description: 'npm script to run for integration tests, only when integration secrets are present.'
        type: string
        default: ''
      integration-secret-name:
        description: 'Name of the secret whose presence gates integration tests (e.g. VENDOR_API_KEY). Empty disables integration step.'
        type: string
        default: ''
      docker-smoke-test:
        description: 'Build the Dockerfile as a smoke test (no push).'
        type: boolean
        default: false
      lint-destructive-warnings:
        description: 'Run scripts/lint-destructive-warnings.mjs against src (used by *-mcp repos with destructive-action tools).'
        type: boolean
        default: false
      credential-mutation-guard:
        description: 'Fail if src/ assigns to process.env (the cross-tenant credential-leak anti-pattern in gateway mode). Use request-scoped credentials instead. Line-level opt-out: append "cred-lint-allow".'
        type: boolean
        default: true
      environment:
        description: 'GitHub Environment to run in (for env-scoped secrets, e.g. "Default").'
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wyre-technology'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        if: inputs.lint
        run: |
          if [ -n "$(node -p "require('./package.json').scripts?.lint || ''")" ]; then
            npm run lint
          else
            echo "::notice::No lint script defined — skipping."
          fi

      - name: Typecheck
        if: inputs.typecheck
        run: |
          if [ -n "$(node -p "require('./package.json').scripts?.typecheck || ''")" ]; then
            npm run typecheck
          else
            echo "::notice::No typecheck script defined — skipping."
          fi

      - name: Build
        if: inputs.build
        run: |
          if [ -n "$(node -p "require('./package.json').scripts?.build || ''")" ]; then
            npm run build
          else
            echo "::notice::No build script defined — skipping."
          fi

      - name: Lint destructive-tool warnings
        if: inputs.lint-destructive-warnings
        run: |
          if [ -f scripts/lint-destructive-warnings.mjs ]; then
            node scripts/lint-destructive-warnings.mjs src
          else
            echo "::notice::scripts/lint-destructive-warnings.mjs not found — skipping."
          fi

      - name: Guard against per-request process.env credential mutation
        if: inputs.credential-mutation-guard
        shell: bash
        run: |
          if [ ! -d src ]; then
            echo "::notice::No src/ directory — skipping credential-mutation guard."
            exit 0
          fi
          # Assigning request credentials to process.env (dot or bracket form) is a
          # cross-tenant leak in gateway/HTTP mode: process.env is process-global, so
          # concurrent tenants race on it. Use request-scoped credentials instead
          # (AsyncLocalStorage / per-request config threading). See saas-alerts-mcp.
          # Excludes tests; append "cred-lint-allow" on a line for a vetted exception.
          matches=$(grep -rnE 'process\.env(\.[A-Za-z_][A-Za-z0-9_]*|\[[^]]+\]) *=[^=]' src \
            --include='*.ts' --include='*.mts' 2>/dev/null \
            | grep -vE '\.test\.|\.spec\.|/__tests__/|/tests?/|cred-lint-allow' || true)
          if [ -n "$matches" ]; then
            echo "::error::Assignment to process.env found in src/. In gateway mode this leaks credentials across concurrent tenants. Use request-scoped credentials (AsyncLocalStorage / per-request config), not process.env mutation. For a genuinely safe non-credential assignment, append '// cred-lint-allow' to the line."
            echo "$matches"
            exit 1
          fi
          echo "::notice::No per-request process.env mutation in src/. ✓"

      - name: Unit tests
        run: npm run ${{ inputs.unit-test-script }}

      - name: Detect integration secrets
        if: inputs.integration-test-script != '' && inputs.integration-secret-name != ''
        shell: bash
        env:
          # secrets[<dynamic>] resolves to '' when secret is absent (forks/dependabot)
          PROBE_VALUE: ${{ secrets[inputs.integration-secret-name] }}
        run: |
          if [ -n "$PROBE_VALUE" ]; then
            echo "HAS_INTEGRATION_SECRETS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_INTEGRATION_SECRETS=false" >> "$GITHUB_ENV"
            echo "::notice::Skipping integration tests — secret not configured for this run (expected on fork/dependabot PRs)."
          fi

      - name: Integration tests
        if: inputs.integration-test-script != '' && env.HAS_INTEGRATION_SECRETS == 'true'
        run: npm run ${{ inputs.integration-test-script }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  docker-smoke:
    name: Docker build smoke test
    if: inputs.docker-smoke-test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Write npmrc for build context
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN"
            printf '@wyre-technology:registry=https://npm.pkg.github.com\n'
            printf 'always-auth=true\n'
          } > /tmp/npmrc
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: smoke-test:latest
          secret-files: |
            npmrc=/tmp/npmrc
