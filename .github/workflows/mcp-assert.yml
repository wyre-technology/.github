name: mcp-assert

on:
  workflow_call:
    inputs:
      entry:
        description: 'Path to the MCP server entry point (e.g. dist/index.js)'
        type: string
        required: true
      canary-tool:
        description: 'Name of one tool to use for protocol-level assertions (any read-only tool)'
        type: string
        required: true
      extra-suite:
        description: 'Optional path to a repo-local evals/ directory to run alongside the baseline'
        type: string
        default: ''
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '24'

# Required so GITHUB_TOKEN can read @wyre-technology/* packages from
# GitHub Packages during `npm ci`. Without packages:read, npm ci 401s
# on the sibling node-<vendor> SDK. See ghcr-npm-auth-in-ci skill.
permissions:
  contents: read
  packages: read

jobs:
  assert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wyre-technology'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build --if-present
      - uses: wyre-technology/mcp-eval-baseline@bbcd7891e9d0904855130959366f58d6f68e01c8 # v1
        with:
          entry: ${{ inputs.entry }}
          canary-tool: ${{ inputs.canary-tool }}
          extra-suite: ${{ inputs.extra-suite }}
